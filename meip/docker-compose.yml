version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DEBUG=1
    depends_on:
      - redis

  worker:
    build: .
    # Using 'solo' pool because users sometimes mount this on Windows hosts, though inside Docker is Linux.
    # 'prefork' (default) is safer for production Linux.
    # We'll stick to default behavior or explicitly use a standard pool for Linux.
    command: celery -A meip worker -l info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DEBUG=1
    depends_on:
      - redis
      - web

volumes:
  redis_data:
